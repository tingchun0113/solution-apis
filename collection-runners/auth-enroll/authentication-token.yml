info:
  name: /authentication/token
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseURL}}/authentication/authToken"
  body:
    type: form-urlencoded
    data:
      - name: grant_type
        value: password
      - name: username
        value: "{{username}}"
      - name: password
        value: "{{password}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("accessToken", res.body.access_token);
    - type: tests
      code: |-
        test("200 status code", function () {
          expect(res.getStatus()).to.eql(200);
        });

        test("body has access_token", function () {
          expect(res.getBody()).to.have.property("access_token");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
