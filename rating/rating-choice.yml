info:
  name: /rating/choice
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseURL}}/rating/choice"
  body:
    type: json
    data: |-
      {
        "membershipReference": {
          "id": "{{custNo}}",
          "type": "CUSTNO"
        },
        "ratingMethod": "TPM",
        "source": "MEMBER",
        "restrictionDisable": true
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
