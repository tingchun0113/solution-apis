info:
  name: /authentication/token
  type: http
  seq: 1

http:
  method: POST
  url: "{{hostname}}/authentication/authToken"
  body:
    type: form-urlencoded
    data:
      - name: grant_type
        value: password
      - name: username
        value: "{{username}}"
      - name: password
        value: "{{password}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("accessToken", res.body.access_token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
