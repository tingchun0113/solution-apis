info:
  name: /membership/enrollPerson
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseURL}}/membership/enrollPerson"
  body:
    type: json
    data: |-
      {
        "customerInputData": {
          "customerType": "PERSONAL",
          "customerDetails": {
            "firstName": "{{$randomFirstName}}",
            "lastName": "{{$randomLastName}}",
            "dateOfBirth": "2000-03-31",
            "countryOfResidence": "TW"
          }
          //     "aliasInputDataList": [
          //       {
          //         "customerAliasType": "TID",
          //         "customerAliasCode": "A123456789"
          //       }
          //     ]
        },
        "membershipInputData": {
          "enrollmentSourceCode": "{{ENROLLMENT_SOURCE_CODE}}"
        }
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const custNo = res.body?.response?.enrollPersonResponse?.code ?? "";

        bru.setEnvVar("custNo", custNo);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
