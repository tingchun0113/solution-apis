info:
  name: /membership/createTierLevelEntitlement
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseURL}}/membership/createTierLevelEntitlement"
  body:
    type: json
    data: |-
      {
        "membershipReference": {
          "id": "{{custNo}}",
          "type": "CUSTNO"
        },
        "tierLevel": "{{TIER_LEVEL}}",
        "tierLevelReason": "{{TIER_LEVEL_REASON}}",
        "activeFrom": "{{today}}",
        "activeTo": "{{dateYearsFromToday}}"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
