info:
  name: /membership/getProfileDetails/{membershipReferenceId}
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseURL}}/membership/getProfileDetails/{{custNo}}"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const customerDetails =
          res.body?.response?.profileDetailsResponse?.customerDetails;

        if (customerDetails?.firstName && customerDetails?.lastName) {
          const { firstName, lastName } = customerDetails;

          bru.setEnvVar("firstName", firstName);
          bru.setEnvVar("lastName", lastName);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
