info:
  name: /membership/getProfileDetails/{membershipReferenceId}
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseURL}}/membership/getProfileDetails/{{custNo}}"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setEnvVar("firstName", res.body.response.profileDetailsResponse.customerDetails.firstName);
        bru.setEnvVar("lastName", res.body.response.profileDetailsResponse.customerDetails.lastName);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
