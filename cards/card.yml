info:
  name: /card
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseURL}}/card"
  body:
    type: json
    data: |-
      {
        "membershipReference": {
          "id": "{{custNo}}",
          "type": "CUSTNO"
        },
        "primaryCard": true,
        "cardType": "AEP"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
