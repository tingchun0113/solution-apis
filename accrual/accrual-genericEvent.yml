info:
  name: /accrual/genericEvent
  type: http
  seq: 2

http:
  method: POST
  url: "{{hostname}}/accrual/genericEvent"
  body:
    type: json
    data: |-
      {
        "membershipReference": {
          "id": "{{custNo}}",
          "type": "CUSTNO"
        },
        "externalCode": "{{$randomUUID}}",
        "partner": "PC",
        "accrualCode": "BUY",
        "value": 10000,
        "actionType": "CREDIT"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
