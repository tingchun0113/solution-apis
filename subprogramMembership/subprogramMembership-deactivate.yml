info:
  name: /subprogramMembership/deactivate
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseURL}}/subprogramMembership/deactivate"
  body:
    type: json
    data: |-
      {
        "membershipReference": {
          "id": "{{custNo}}",
          "type": "CUSTNO"
        },
        "subprogramCode": "DOB"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
