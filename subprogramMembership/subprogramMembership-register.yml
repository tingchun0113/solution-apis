info:
  name: /subprogramMembership/register
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseURL}}/subprogramMembership/register"
  body:
    type: json
    data: |-
      {
        "membershipReference": {
          "id": "{{custNo}}",
          "type": "CUSTNO"
        },
        "subprogram": "DOB"
        //   "deactivateSystemChecks": true
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
