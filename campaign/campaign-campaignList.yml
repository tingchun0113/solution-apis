info:
  name: /campaign/campaignList
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseURL}}/campaign/campaignList?membershipReferenceId={{custNo}}&addPromotionTargetStates=true"
  params:
    - name: membershipReferenceId
      value: "{{custNo}}"
      type: query
    - name: addPromotionTargetStates
      value: "true"
      type: query
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
