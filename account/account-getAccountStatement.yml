info:
  name: /account/getAccountStatement
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseURL}}/account/getAccountStatement"
  body:
    type: json
    data: |-
      {
        "membershipReference": {
          "id": "{{custNo}}"
        }
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
