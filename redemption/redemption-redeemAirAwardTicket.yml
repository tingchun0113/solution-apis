info:
  name: /redemption/redeemAirAwardTicket
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseURL}}/redemption/redeemAirAwardTicket"
  body:
    type: json
    data: |-
      {
        "membershipReference": {
          "id": "{{custNo}}",
          "type": "CUSTNO"
        },
        "externalCode": "{{$randomUUID}}",
        "partner": "BR",
        "activityDateTime": "2026-10-01",
        "awardCode": "CDTKT",
        "flightInfo": {
          "origin": "MUC",
          "destination": "TPE",
          "passengers": [
            {
              "identifier": "{{$randomInt}}",
              "passengerFirstName": "{{firstName}}",
              "passengerLastName": "{{lastName}}"
            }
          ],
          "segments": [
            {
              "identifier": "{{$randomInt}}",
              "origin": "MUC",
              "destination": "VIE",
              "airlineCode": "BR",
              "flightNumber": 101,
              "flightDate": "2026-11-05",
              "paidClass": "B"
            },
            {
              "identifier": "{{$randomInt}}",
              "origin": "VIE",
              "destination": "TPE",
              "airlineCode": "BR",
              "flightNumber": 102,
              "flightDate": "2026-11-05",
              "paidClass": "B"
            }
          ]
        },
        "currency": "{{PROGRAM_CURRENCY}}",
        "basePrice": 1500
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const certificateCode = res.body?.response?.certificateCode ?? "";

        bru.setEnvVar("certificateCode", certificateCode);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
