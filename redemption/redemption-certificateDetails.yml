info:
  name: /redemption/certificateDetails
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseURL}}/redemption/certificateDetails?certificateCode={{certificateCode}}"
  params:
    - name: certificateCode
      value: "{{certificateCode}}"
      type: query
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
