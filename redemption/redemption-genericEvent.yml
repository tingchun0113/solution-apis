info:
  name: /redemption/genericEvent
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseURL}}/redemption/genericEvent"
  body:
    type: json
    data: |-
      {
        "membershipReference": {
          "id": "{{custNo}}",
          "type": "CUSTNO"
        },
        "externalCode": "{{$randomUUID}}",
        "partner": "{{PARTNER_STANDARD}}",
        "awardCode": "{{awardCode}}",
        "programCurrencyAmounts": [
          {
            "currency": "{{PROGRAM_CURRENCY}}",
            "amount": 500
          }
        ]
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const certificateCode = res.body?.response?.certificateCode ?? "";

        bru.setEnvVar("certificateCode", certificateCode);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
